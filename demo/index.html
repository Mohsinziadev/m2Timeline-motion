<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Timelines: React timeline &amp; progress components</title>
    <meta
      name="description"
      content="Fourteen production-ready React timeline layouts plus progress bars, steppers and gauges, with live customizable demos, a playground and a TypeScript API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Dark by default. Only a visitor's own choice (the theme toggle) switches to light.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('m2t-theme-choice') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
